[project]
name = "byteqc"
version = "0.1.0+cu129"
description = "ByteQC (github.com/bytedance/byteqc) with prebuilt CUDA 12.9 kernels for sm_70/80/90"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cupy-cuda12x[ctk]>=14,<15",
    "cutensor-cu12>=2.6,<3",
    "nvidia-cublas-cu12>=12.9,<13",
    "nvmath-python>=1.0",
    "pyscf>=2.14,<2.15",
    "numpy",
    "scipy",
    "h5py",
]

[project.optional-dependencies]
gpu4pyscf = ["gpu4pyscf-cuda12x"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["byteqc"]
# byteqc's own .gitignore excludes *.so, which hatchling would otherwise honour
artifacts = ["byteqc/**/*.so"]
exclude = ["*.cu", "*.cuh", "*.c", "*.h", "CMakeLists.txt", "setup.py", "build/", ".git/"]
