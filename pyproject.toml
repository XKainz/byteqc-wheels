[project]
name = "byteqc"
# set by scripts/package.sh from the pinned upstream commit, see byteqc/_build_info.py
dynamic = ["version"]
description = "Unofficial build of ByteQC (github.com/bytedance/byteqc) with prebuilt CUDA 12.9 kernels; not affiliated with ByteDance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cupy-cuda12x[ctk]>=14,<15",
    "cutensor-cu12>=2.6,<3",
    "nvidia-cublas-cu12>=12.9,<13",
    "nvmath-python>=1.0",
    "pyscf>=2.14,<2.15",
    "numpy",
    "scipy",
    "h5py",
]

[project.urls]
Upstream = "https://github.com/bytedance/byteqc"
Build-recipe = "https://github.com/XKainz/byteqc-wheels"

[project.optional-dependencies]
gpu4pyscf = ["gpu4pyscf-cuda12x"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "byteqc/_build_info.py"

[tool.hatch.build]
# Don't let .gitignore files decide what ships: this repo ignores the byteqc/
# checkout, and byteqc's own .gitignore ignores *.so. Both would empty the wheel.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["byteqc"]
exclude = ["__pycache__", "*.cu", "*.cuh", "*.c", "*.h", "CMakeLists.txt", "setup.py", "build/", ".git/"]
